id: null-safety-001
name: Detect possible null dereference

prompt: |
  Review the following Java code:

  ```java
  public class UserService {

      public String username(User user) {
          return user.getName().toUpperCase();
      }
  }
  ```

  Identify the main problem.

judge:
  criteria: |
    The response must correctly identify that the code can fail
    because User may be null, getName() may return null, or both.
